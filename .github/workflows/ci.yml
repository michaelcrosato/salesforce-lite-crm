name: CI Gate

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Deterministic gate: lint + typecheck + test + build.
  # This is the required status check — it is the same sequence the local
  # Stop-hook gate runs and is verified green on CI runners.
  gate:
    name: gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/dev.db
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Security gate: fail on High/Critical advisories. Threshold is `high`
      # to block High/Critical without failing on Low/Moderate noise.
      - name: Security audit
        run: npm audit --audit-level=high

      - name: Prepare .env
        run: cp .env.example .env

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Database Push (SQLite)
        run: npx prisma db push

      - name: Seed Database
        run: npm run seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # Advisory end-to-end suite. continue-on-error keeps it non-blocking so
  # CI-only e2e differences do not gate merges. Tracked for repair in TICKET008;
  # promote to a required check once green on CI.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DATABASE_URL: file:./prisma/dev.db
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare .env
        run: cp .env.example .env

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Database Push (SQLite)
        run: npx prisma db push

      - name: Seed Database
        run: npm run seed

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: E2E (advisory)
        run: npm run test:e2e
